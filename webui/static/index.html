<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rainbow Crawler Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css?v=20260921-16">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">R</span>
      <div>
        <strong>Rainbow</strong>
        <span>Crawler Console</span>
      </div>
    </div>
    <div class="refresh-panel">
      <div class="sync-meta">
        <span>最后同步</span>
        <strong id="lastRefresh">同步中</strong>
        <small id="refreshState">自动刷新已开启</small>
      </div>
      <div id="refreshIntervalPicker" class="refresh-interval">
        <span>刷新</span>
        <button id="refreshIntervalButton" class="refresh-interval-trigger" type="button" aria-label="自动刷新间隔，当前 2 秒" aria-haspopup="listbox" aria-expanded="false">
          <strong id="refreshIntervalValue">2s</strong>
          <span class="select-chevron" aria-hidden="true"></span>
        </button>
        <div id="refreshIntervalMenu" class="refresh-interval-menu" role="listbox" aria-label="自动刷新间隔" hidden>
          <button type="button" role="option" data-value="500" aria-selected="false">0.5s</button>
          <button type="button" role="option" data-value="1000" aria-selected="false">1s</button>
          <button type="button" role="option" data-value="2000" aria-selected="true">2s</button>
          <button type="button" role="option" data-value="3000" aria-selected="false">3s</button>
        </div>
        <input id="refreshInterval" type="hidden" value="2000">
      </div>
      <button id="pauseButton" class="refresh-control" type="button" title="暂停自动刷新" aria-label="暂停自动刷新">
        <span class="pause-icon" aria-hidden="true"></span>
      </button>
      <button id="refreshButton" class="refresh-control" type="button" title="立即刷新" aria-label="立即刷新">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="summary" aria-label="运行概览">
      <div><span>爬虫总数</span><strong id="totalCount">0</strong></div>
      <div><span>运行中</span><strong id="runningCount">0</strong></div>
      <div><span>空闲</span><strong id="idleCount">0</strong></div>
      <div><span>已爬取帖子</span><strong id="rawdataCount">0</strong></div>
      <button id="createButton" class="primary-button" type="button"><span>+</span> 新建爬虫</button>
    </section>

    <div class="workspace">
      <section class="crawler-panel">
        <div class="section-heading">
          <div><span class="eyebrow">FLEET</span><h1>爬虫实例</h1></div>
        </div>
        <div id="crawlerList" class="crawler-list"></div>
        <div id="emptyState" class="empty-state" hidden>
          <strong>还没有爬虫</strong>
          <span>创建第一个实例开始工作。</span>
        </div>
      </section>

      <section class="activity-panel">
        <div class="section-heading activity-heading">
          <div><span class="eyebrow">ACTIVITY</span><h2>实时日志</h2></div>
          <select id="logFilter" aria-label="筛选爬虫日志"><option value="">全部爬虫</option></select>
        </div>
        <div id="logList" class="log-list"></div>
      </section>
    </div>
  </main>

  <dialog id="crawlerDialog">
    <form id="createForm" method="dialog">
      <div class="dialog-heading"><div><span id="crawlerDialogEyebrow" class="eyebrow">NEW INSTANCE</span><h2 id="crawlerDialogTitle">新建爬虫</h2></div><button class="close-button" value="cancel" aria-label="关闭">×</button></div>
      <label>爬虫 ID<input name="crawler_id" required maxlength="64" placeholder="例如 xhs_TEL7236"></label>
      <label>用户数据目录<input name="user_data_dir" required maxlength="256" placeholder="例如 xhs_TEL7236"></label>
      <label>图片策略<select name="image_strategy"><option value="none">正常加载</option><option value="ban">禁止加载</option><option value="blank">空白图片</option><option value="cache">本地缓存</option></select></label>
      <details class="proxy-panel">
        <summary>代理</summary>
        <div class="proxy-fields">
          <label>URL<input name="proxy_url" maxlength="2048" placeholder="host:port"></label>
          <label>用户名<input name="proxy_user" maxlength="256" autocomplete="username"></label>
          <label>密码<input name="proxy_password" type="password" maxlength="256" autocomplete="new-password"></label>
        </div>
      </details>
      <p id="createError" class="form-error"></p>
      <div class="dialog-actions"><button id="deleteCrawler" type="button" class="delete-button" hidden>删除爬虫</button><button value="cancel" class="secondary-button">取消</button><button id="submitCrawler" type="submit" value="default" class="primary-button">创建实例</button></div>
    </form>
  </dialog>

  <dialog id="timingDialog">
    <form id="timingForm" method="dialog">
      <div class="dialog-heading"><div><span class="eyebrow">WAIT TIMING</span><h2>等待时间</h2></div><button class="close-button" value="cancel" aria-label="关闭">×</button></div>
      <input type="hidden" name="crawler_id">
      <div class="timing-fields">
        <label>基准时间（秒）<input name="wait_base_seconds" type="number" required min="0" max="300" step="0.1"></label>
        <label>泛化率<input name="wait_random_rate" type="number" required min="0" max="10" step="0.1"></label>
      </div>
      <fieldset class="multiplier-fields">
        <legend>调用点系数</legend>
        <label>首次加载<input name="wait_initial_multiplier" type="number" required min="0" max="10" step="0.1"></label>
        <label>滚动加载<input name="wait_scroll_multiplier" type="number" required min="0" max="10" step="0.1"></label>
        <label>帖子交互<input name="wait_post_multiplier" type="number" required min="0" max="10" step="0.1"></label>
        <label>打开详情<input name="wait_detail_open_multiplier" type="number" required min="0" max="10" step="0.1"></label>
        <label>关闭详情<input name="wait_detail_close_multiplier" type="number" required min="0" max="10" step="0.1"></label>
        <label>异常恢复<input name="wait_error_multiplier" type="number" required min="0" max="10" step="0.1"></label>
      </fieldset>
      <p id="timingError" class="form-error"></p>
      <div class="dialog-actions"><button value="cancel" class="secondary-button">取消</button><button type="submit" value="default" class="primary-button">立即应用</button></div>
    </form>
  </dialog>

  <dialog id="gotoDialog">
    <form id="gotoForm" method="dialog">
      <div class="dialog-heading"><div><span class="eyebrow">NAVIGATE</span><h2>跳转页面</h2></div><button class="close-button" value="cancel" aria-label="关闭">×</button></div>
      <input type="hidden" name="crawler_id">
      <label>目标 URL<input name="url" type="url" required value="https://www.xiaohongshu.com/explore/" placeholder="https://www.xiaohongshu.com/explore/"></label>
      <p id="gotoError" class="form-error"></p>
      <div class="dialog-actions"><button value="cancel" class="secondary-button">取消</button><button type="submit" value="default" class="primary-button">发送动作</button></div>
    </form>
  </dialog>

  <dialog id="imagePreviewDialog" class="image-preview-dialog">
    <button class="close-button image-preview-close" type="button" aria-label="关闭大图">×</button>
    <img id="imagePreview" alt="截屏大图">
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <script src="/static/app.js?v=20260921-17" defer></script>
</body>
</html>
